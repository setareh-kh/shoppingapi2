services:
  mysql:
    image: mysql:8.0
    container_name: shoppingapi2-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: shoppingapi2dev3
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - shoppingapi2-mysql-data:/var/lib/mysql
  redis:
    image: redis:7
    container_name: shoppingapi2-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - shoppingapi2-redis-data:/data
volumes:
  shoppingapi2-mysql-data:
  shoppingapi2-redis-data:
    external: true
    name: shoppingapi2-redis-data
